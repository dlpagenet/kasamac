<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Zamówień McDonald's</title>
  <style>
    /* Ogólne style dla całej strony */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Gadget, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff; /* Biały tekst wszędzie */
      text-align: center;
      padding: 20px;
    }

    h1, h2 {
      margin-bottom: 20px;
      color: #ffffff;
    }

    /* Pasek nawigacji / Menu główne */
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .main-btn {
      background-color: #222;
      color: #ffffff;
      border: 3px solid #ffbc0d; /* Żółty akcent McDonald's */
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
    }

    .main-btn:hover {
      background-color: #ffbc0d;
      color: #000000;
    }

    /* Widoki stron */
    .view {
      display: none;
    }

    .active {
      display: block;
    }

    /* --- EKRAN ZAMÓWIEŃ (TABELA) --- */
    .board {
      display: flex;
      justify-content: center;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .column {
      flex: 1;
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      min-height: 400px;
      border: 2px solid #333;
    }

    /* Tytuły kolumn zgodnie z wymaganiami */
    .column-title {
      padding: 15px;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .title-prep {
      background-color: #555555; /* Szare tło dla przygotowaniu */
      color: #ffffff;
    }

    .title-ready {
      background-color: #2e7d32; /* Zielone tło dla gotowych */
      color: #ffffff;
    }

    .order-list {
      list-style: none;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .order-number {
      font-size: 36px;
      font-weight: bold;
      color: #ffffff;
      background-color: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
    }

    /* --- PANEL KASJERA --- */
    .cashier-box {
      max-width: 600px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      border: 2px solid #333;
    }

    .add-form {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 18px;
      border-radius: 6px;
      border: 2px solid #555;
      background-color: #2a2a2a;
      color: #ffffff;
      text-align: center;
      width: 180px;
    }

    .action-btn {
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-add {
      background-color: #0288d1;
    }

    .btn-move {
      background-color: #2e7d32; /* Zielony guzik jak nagłówek */
    }

    .btn-delete {
      background-color: #d32f2f;
    }

    .action-btn:hover {
      opacity: 0.8;
    }

    .cashier-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2a2a2a;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .item-controls {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Górne guziki nawigacji -->
  <div class="top-bar">
    <button class="main-btn" onclick="showView('ordersView')">Ekran Zamówień</button>
    <button class="main-btn" onclick="showView('cashierView')">Panel Kasjera</button>
  </div>

  <!-- WIDOK 1: EKRAN ZAMÓWIEŃ -->
  <div id="ordersView" class="view active">
    <h1>Stan Zamówień</h1>
    <div class="board">
      
      <!-- Kolumna W Przygotowaniu -->
      <div class="column">
        <div class="column-title title-prep">W przygotowaniu</div>
        <ul id="boardPrep" class="order-list"></ul>
      </div>

      <!-- Kolumna Gotowe -->
      <div class="column">
        <div class="column-title title-ready">Gotowe do odbioru</div>
        <ul id="boardReady" class="order-list"></ul>
      </div>

    </div>
  </div>

  <!-- WIDOK 2: PANEL KASJERA -->
  <div id="cashierView" class="view">
    <h1>Panel Kasjera</h1>
    <div class="cashier-box">
      
      <div class="add-form">
        <input type="text" id="orderInput" placeholder="Nr (np. 101)">
        <button class="action-btn btn-add" onclick="addOrder()">+ Dodaj Zamówienie</button>
      </div>

      <h2>Zarządzaj Zamówieniami</h2>
      <div id="cashierList"></div>

    </div>
  </div>

  <script>
    // Tablica do przechowywania zamówień w pamięci programu
    let orders = [];

    // Przełączanie między widokami
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(viewId).classList.add('active');
    }

    // Dodawanie nowego zamówienia
    function addOrder() {
      const input = document.getElementById('orderInput');
      const number = input.value.trim();

      if (number === '') {
        alert('Wpisz numer zamówienia!');
        return;
      }

      // Domyślnie nowe zamówienie trafia do "W przygotowaniu" (status: prep)
      orders.push({ id: Date.now(), number: number, status: 'prep' });
      input.value = '';

      render();
    }

    // Zmiana statusu na "Gotowe"
    function moveToReady(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = 'ready';
        render();
      }
    }

    // Usuwanie zamówienia
    function deleteOrder(id) {
      orders = orders.filter(o => o.id !== id);
      render();
    }

    // Odświeżanie widoków (Rysowanie elementów na nowo)
    function render() {
      const boardPrep = document.getElementById('boardPrep');
      const boardReady = document.getElementById('boardReady');
      const cashierList = document.getElementById('cashierList');

      // Czyszczenie obecnych elementów
      boardPrep.innerHTML = '';
      boardReady.innerHTML = '';
      cashierList.innerHTML = '';

      orders.forEach(order => {
        // 1. Dodawanie do Ekranu Zamówień
        const li = document.createElement('li');
        li.className = 'order-number';
        li.textContent = order.number;

        if (order.status === 'prep') {
          boardPrep.appendChild(li);
        } else {
          boardReady.appendChild(li);
        }

        // 2. Dodawanie do Panelu Kasjera
        const cashierItem = document.createElement('div');
        cashierItem.className = 'cashier-item';

        const statusText = order.status === 'prep' ? '(W przygotowaniu)' : '(Gotowe)';
        
        cashierItem.innerHTML = `
          <span><strong>#${order.number}</strong> ${statusText}</span>
          <div class="item-controls">
            ${order.status === 'prep' 
              ? `<button class="action-btn btn-move" onclick="moveToReady(${order.id})">Gotowe</button>` 
              : ''}
            <button class="action-btn btn-delete" onclick="deleteOrder(${order.id})">Usuń</button>
          </div>
        `;

        cashierList.appendChild(cashierItem);
      });
    }
  </script>
</body>
</html>
