<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>System Zamówień McDonald's</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', Gadget, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
    }

    /* Pasek nawigacji */
    .top-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .main-btn {
      background-color: #222;
      color: #ffffff;
      border: 3px solid #ffbc0d;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }

    .main-btn:active {
      background-color: #ffbc0d;
      color: #000000;
    }

    /* Widoki */
    .view {
      display: none;
      position: relative;
    }

    .active {
      display: block;
    }

    /* Guzik pełnego ekranu (dyskretny w narożniku) */
    .fullscreen-btn {
      position: absolute;
      top: -10px;
      right: 0;
      background-color: #222;
      color: #aaa;
      border: 1px solid #444;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 5px;
      z-index: 10;
    }

    /* --- EKRAN ZAMÓWIEŃ (TABLET) --- */
    .board {
      display: flex;
      justify-content: center;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 80vh;
    }

    .column {
      flex: 1;
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
    }

    .column-title {
      padding: 18px;
      font-size: 24px;
      text-transform: uppercase;
    }

    .title-prep {
      background-color: #555555;
      color: #ffffff;
    }

    .title-ready {
      background-color: #2e7d32;
      color: #ffffff;
    }

    .order-list {
      list-style: none;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-content: flex-start;
    }

    .order-number {
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      background-color: #2a2a2a;
      padding: 8px 16px;
      border-radius: 8px;
    }

    /* TRYB PEŁNOEKRANOWY - EKRAN ZAMÓWIEŃ */
    #ordersView:fullscreen body { padding: 0; }
    #ordersView:fullscreen .top-bar, #ordersView:fullscreen h1 { display: none; }
    #ordersView:fullscreen .board { max-width: 100vw; height: 100vh; gap: 0; }
    #ordersView:fullscreen .column { border: none; border-radius: 0; background-color: transparent; }
    #ordersView:fullscreen .column-title { font-size: 32px; padding: 20px; }
    #ordersView:fullscreen .order-number { font-size: 58px; background-color: transparent; padding: 10px 25px; }

    /* --- PANEL KASJERA (PIONOWY TELEFON) --- */
    .cashier-box {
      max-width: 380px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
    }

    /* Wyświetlacz numeru */
    .display-input {
      width: 100%;
      padding: 10px;
      font-size: 32px;
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #555;
      background-color: #000;
      color: #ffbc0d;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    /* Klawiatura numeryczna pod pionowy telefon */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .num-btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      padding: 16px 0;
      font-size: 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .num-btn:active {
      background-color: #ffbc0d;
      color: #000000;
    }

    .btn-clear { background-color: #d32f2f; }
    .btn-back { background-color: #f57c00; }

    .action-btn {
      padding: 12px 15px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-add {
      width: 100%;
      background-color: #0288d1;
      margin-bottom: 15px;
      font-size: 18px;
      padding: 14px 0;
    }

    .btn-move { background-color: #2e7d32; }
    .btn-delete { background-color: #d32f2f; }

    /* Lista zamówień na telefonie z własnym suwakiem */
    .cashier-list-container {
      max-height: 220px;
      overflow-y: auto;
      margin-top: 5px;
    }

    .cashier-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2a2a2a;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .item-controls {
      display: flex;
      gap: 6px;
    }

    /* TRYB PEŁNOEKRANOWY - PANEL KASJERA (TELEFON) */
    #cashierView:fullscreen {
      background-color: #121212;
      height: 100vh;
      width: 100vw;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #cashierView:fullscreen h1 {
      display: none; /* Ukryj nagłówek na pełnym ekranie telefonu */
    }

    #cashierView:fullscreen .cashier-box {
      border: none;
      background-color: transparent;
      padding: 0;
      max-width: 100%;
      height: 100%;
      justify-content: space-between;
    }

    #cashierView:fullscreen .fullscreen-btn {
      top: 5px;
      right: 5px;
    }

    #cashierView:fullscreen .cashier-list-container {
      flex: 1;
      max-height: none;
    }
  </style>
</head>
<body>

  <!-- Menu nawigacji -->
  <div class="top-bar">
    <button class="main-btn" onclick="showView('ordersView')">Ekran Zamówień</button>
    <button class="main-btn" onclick="showView('cashierView')">Panel Kasjera</button>
  </div>

  <!-- WIDOK 1: EKRAN ZAMÓWIEŃ (TABLET) -->
  <div id="ordersView" class="view active">
    <button class="fullscreen-btn" onclick="toggleFullScreen('ordersView')">⛶ Pełny ekran</button>
    <h1>Stan Zamówień</h1>
    
    <div class="board">
      <div class="column">
        <div class="column-title title-prep">W przygotowaniu</div>
        <ul id="boardPrep" class="order-list"></ul>
      </div>

      <div class="column">
        <div class="column-title title-ready">Gotowe do odbioru</div>
        <ul id="boardReady" class="order-list"></ul>
      </div>
    </div>
  </div>

  <!-- WIDOK 2: PANEL KASJERA (PIONOWY TELEFON) -->
  <div id="cashierView" class="view">
    <button class="fullscreen-btn" onclick="toggleFullScreen('cashierView')">⛶ Pełny ekran</button>
    <h1>Panel Kasjera</h1>
    
    <div class="cashier-box">
      
      <!-- Ekran wpisywanego numeru -->
      <input type="text" id="orderInput" class="display-input" placeholder="Wpisz nr" readonly>

      <!-- Klawiatura numeryczna -->
      <div class="numpad">
        <button class="num-btn" onclick="pressNum('1')">1</button>
        <button class="num-btn" onclick="pressNum('2')">2</button>
        <button class="num-btn" onclick="pressNum('3')">3</button>
        <button class="num-btn" onclick="pressNum('4')">4</button>
        <button class="num-btn" onclick="pressNum('5')">5</button>
        <button class="num-btn" onclick="pressNum('6')">6</button>
        <button class="num-btn" onclick="pressNum('7')">7</button>
        <button class="num-btn" onclick="pressNum('8')">8</button>
        <button class="num-btn" onclick="pressNum('9')">9</button>
        <button class="num-btn btn-clear" onclick="clearInput()">C</button>
        <button class="num-btn" onclick="pressNum('0')">0</button>
        <button class="num-btn btn-back" onclick="backspaceInput()">←</button>
      </div>

      <button class="action-btn btn-add" onclick="addOrder()">+ Dodaj Zamówienie</button>

      <div class="cashier-list-container">
        <div id="cashierList"></div>
      </div>

    </div>
  </div>

  <script>
    let orders = [];

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      document.getElementById(viewId).classList.add('active');
    }

    // Przełączanie pełnego ekranu dla konkretnego widoku
    function toggleFullScreen(elementId) {
      const elem = document.getElementById(elementId);

      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* Klawiatura numeryczna */
    function pressNum(num) {
      const input = document.getElementById('orderInput');
      if (input.value.length < 4) {
        input.value += num;
      }
    }

    function clearInput() {
      document.getElementById('orderInput').value = '';
    }

    function backspaceInput() {
      const input = document.getElementById('orderInput');
      input.value = input.value.slice(0, -1);
    }

    /* Dodawanie zamówienia */
    function addOrder() {
      const input = document.getElementById('orderInput');
      const number = input.value.trim();

      if (number === '') return;

      orders.push({ id: Date.now(), number: number, status: 'prep' });
      input.value = '';

      render();
    }

    function moveToReady(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = 'ready';
        render();
      }
    }

    function deleteOrder(id) {
      orders = orders.filter(o => o.id !== id);
      render();
    }

    function render() {
      const boardPrep = document.getElementById('boardPrep');
      const boardReady = document.getElementById('boardReady');
      const cashierList = document.getElementById('cashierList');

      boardPrep.innerHTML = '';
      boardReady.innerHTML = '';
      cashierList.innerHTML = '';

      orders.forEach(order => {
        const li = document.createElement('li');
        li.className = 'order-number';
        li.textContent = order.number;

        if (order.status === 'prep') {
          boardPrep.appendChild(li);
        } else {
          boardReady.appendChild(li);
        }

        const cashierItem = document.createElement('div');
        cashierItem.className = 'cashier-item';

        const statusText = order.status === 'prep' ? '(W przyg.)' : '(Gotowe)';
        
        cashierItem.innerHTML = `
          <span><strong>#${order.number}</strong> <small style="color:#aaa">${statusText}</small></span>
          <div class="item-controls">
            ${order.status === 'prep' 
              ? `<button class="action-btn btn-move" onclick="moveToReady(${order.id})">Gotowe</button>` 
              : ''}
            <button class="action-btn btn-delete" onclick="deleteOrder(${order.id})">Usuń</button>
          </div>
        `;

        cashierList.appendChild(cashierItem);
      });
    }
  </script>
</body>
</html>
